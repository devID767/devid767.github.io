      /* Полка листается стрелками: горизонтальная лента без видимого управления
         на десктопе читается как обрыв, а не как «здесь есть ещё». */
      document.querySelectorAll('.shelf-nav button, .shots-nav button').forEach(function (b) {
        b.addEventListener('click', function () {
          var box = document.getElementById(b.parentNode.dataset.for);
          if (box) box.scrollBy({ left: b.dataset.dir * Math.round(box.clientWidth * 0.8), behavior: 'smooth' });
        });
      });
      /* Стрелки над лентой, которая целиком помещается в колонку, ведут в пустоту —
         на кейсе с двумя кадрами они просто не нажимаются. Показываем их только
         когда листать действительно есть что. */
      (function () {
        var navs = [].slice.call(document.querySelectorAll('.shots-nav'));
        if (!navs.length) return;
        function sync() {
          navs.forEach(function (n) {
            var box = document.getElementById(n.dataset.for);
            n.style.visibility = box && box.scrollWidth > box.clientWidth + 4 ? '' : 'hidden';
          });
        }
        sync();
        window.addEventListener('resize', sync);
        window.addEventListener('load', sync);
      })();
      /* Кадры в ленте — превью одной высоты, как в сторе: рассмотреть их можно
         только на полном экране, поэтому клик открывает лайтбокс. Без него
         вертикальный кадр в такой ленте нечитаем. Листается стрелками и свайпом
         по тем же кадрам, что в ленте. */
      (function () {
        var lane = document.getElementById('case-shots');
        if (!lane) return;
        var frames = [].slice.call(lane.querySelectorAll('img'));
        if (!frames.length) return;
        var box = document.createElement('div');
        box.className = 'lightbox';
        box.setAttribute('hidden', '');
        box.setAttribute('role', 'dialog');
        box.setAttribute('aria-modal', 'true');
        box.setAttribute('aria-label', 'Screenshot viewer');
        box.innerHTML =
          '<button class="lb-close" aria-label="Close">✕</button>' +
          '<button class="lb-prev" aria-label="Previous screenshot">←</button>' +
          '<img alt="">' +
          '<button class="lb-next" aria-label="Next screenshot">→</button>';
        document.body.appendChild(box);
        var pic = box.querySelector('img');
        var stops = [].slice.call(box.querySelectorAll('button'));
        var at = 0, cameFrom = null;
        function show(i) {
          at = (i + frames.length) % frames.length;
          pic.src = frames[at].src;
          pic.alt = frames[at].alt || '';
        }
        function open(i) {
          cameFrom = frames[i].parentNode;
          show(i);
          box.removeAttribute('hidden');
          document.body.style.overflow = 'hidden';
          box.querySelector('.lb-close').focus();
        }
        function close() {
          box.setAttribute('hidden', '');
          document.body.style.overflow = '';
          /* Фокус возвращается на тот кадр, с которого открыли, иначе с клавиатуры
             человек вываливается в начало страницы и листает ленту заново. */
          if (cameFrom) cameFrom.focus();
          cameFrom = null;
        }
        frames.forEach(function (f, i) {
          var slot = f.parentNode;
          slot.style.cursor = 'zoom-in';
          /* Кадр открывается не только мышью: без этого лента была недостижима
             с клавиатуры — обёртка кадра обычный div. */
          slot.setAttribute('tabindex', '0');
          slot.setAttribute('role', 'button');
          slot.setAttribute('aria-label', 'Open ' + (f.alt || 'screenshot') + ' full screen');
          slot.addEventListener('click', function () { open(i); });
          slot.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(i); }
          });
        });
        box.querySelector('.lb-close').addEventListener('click', close);
        box.querySelector('.lb-prev').addEventListener('click', function (e) { e.stopPropagation(); show(at - 1); });
        box.querySelector('.lb-next').addEventListener('click', function (e) { e.stopPropagation(); show(at + 1); });
        box.addEventListener('click', function (e) { if (e.target === box || e.target === pic) close(); });
        document.addEventListener('keydown', function (e) {
          if (box.hasAttribute('hidden')) return;
          if (e.key === 'Escape') close();
          if (e.key === 'ArrowLeft') show(at - 1);
          if (e.key === 'ArrowRight') show(at + 1);
          /* Ловушка фокуса: пока открыт полноэкранный просмотр, Tab ходит по его же
             трём кнопкам. Иначе фокус уезжает в спрятанную за ним страницу. */
          if (e.key === 'Tab') {
            e.preventDefault();
            var i = stops.indexOf(document.activeElement);
            var next = (i + (e.shiftKey ? -1 : 1) + stops.length) % stops.length;
            stops[i < 0 ? 0 : next].focus();
          }
        });
      })();

      var SITE = document.getElementById('site');
      function setTheme(t) {
        SITE.dataset.theme = t;
        document.documentElement.dataset.pfTheme = t;
        var b = document.getElementById('themer');
        if (b) b.textContent = t === 'light' ? '☾' : '☀';
        try { localStorage.setItem('pf-theme', t); } catch (e) {}
      }
      setTheme(document.documentElement.dataset.pfTheme || 'dark');
      document.getElementById('themer').addEventListener('click', function () {
        setTheme(SITE.dataset.theme === 'light' ? 'dark' : 'light');

      /* Высота липкого стека МЕРЯЕТСЯ, а не хардкодится: иначе якоря
         роняют заголовок секции под шапку (находка F2 ревью №3). */
      function measureChrome() {
        var nav = SITE.querySelector('.nav'), anc = SITE.querySelector('.anchors');
        if (nav) SITE.style.setProperty('--nav-h', Math.round(nav.getBoundingClientRect().height) + 'px');
        if (anc) SITE.style.setProperty('--anchors-h', Math.round(anc.getBoundingClientRect().height) + 'px');
      }
      measureChrome();
      window.addEventListener('resize', measureChrome);

      /* Присланная ссылка вида /#about открывалась НАВЕРХУ: браузер пробует
         прыжок до того, как картинки посчитали высоту, и промахивается.
         Повторяем прыжок после полной загрузки. */
      if (location.hash.length > 1) {
        var jump = function () {
          var el = document.getElementById(decodeURIComponent(location.hash.slice(1)));
          if (!el) return;
          /* Мгновенно: html{scroll-behavior:smooth} превращает догоняющий прыжок
             в анимацию, которая на медленной загрузке не доезжает. */
          var root = document.documentElement, prev = root.style.scrollBehavior;
          root.style.scrollBehavior = 'auto';
          var css = getComputedStyle(SITE),
              off = (parseInt(css.getPropertyValue('--nav-h')) || 0) + (parseInt(css.getPropertyValue('--anchors-h')) || 0) + 14;
          window.scrollTo(0, Math.max(0, el.getBoundingClientRect().top + window.pageYOffset - off));
          root.style.scrollBehavior = prev;
        };
        window.addEventListener('load', function () { jump(); setTimeout(jump, 120); });
      }
      if (window.ResizeObserver) new ResizeObserver(measureChrome).observe(SITE);
